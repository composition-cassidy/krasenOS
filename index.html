<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krasen's Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --desktop-bg: #0a0e1a;
    --taskbar-bg: linear-gradient(180deg, #1a2744 0%, #0d1529 40%, #0a1020 100%);
    --window-bg: #111827;
    --window-header: linear-gradient(180deg, #1e3a5f 0%, #15294a 50%, #0f1f3a 100%);
    --window-header-inactive: linear-gradient(180deg, #1a1f2e 0%, #141927 50%, #10141f 100%);
    --window-border: #2a3a5a;
    --window-border-glow: #3b5998;
    --accent: #33CED6;
    --accent-dim: #1a8a90;
    --text: #e2e8f0;
    --text-dim: #8892a4;
    --text-bright: #ffffff;
    --explorer-sidebar: #0d1220;
    --item-hover: rgba(51, 206, 214, 0.08);
    --item-selected: rgba(51, 206, 214, 0.15);
    --scrollbar-track: #0a0f1a;
    --scrollbar-thumb: #1e2d4a;
    --btn-close: #e74c3c;
    --btn-max: #f39c12;
    --btn-min: #2ecc71;
    --download-btn: linear-gradient(135deg, #1a8a90 0%, #33CED6 100%);
    --shadow-window: 0 20px 60px rgba(0,0,0,0.7), 0 0 1px rgba(51,206,214,0.2);
    --shadow-window-active: 0 25px 80px rgba(0,0,0,0.8), 0 0 30px rgba(51,206,214,0.1);
  }

  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: var(--desktop-bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh; width: 100vw;
    user-select: none; cursor: default;
  }

  #desktop {
    position: relative; width: 100vw; height: calc(100vh - 48px);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(30, 58, 95, 0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(15, 31, 58, 0.6) 0%, transparent 50%),
      linear-gradient(135deg, #080c18 0%, #0a1225 30%, #0d1a35 60%, #080c18 100%);
  }
  #desktop::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 9999;
  }

  .desktop-icons { display: flex; flex-direction: column; gap: 8px; padding: 20px; position: absolute; top: 0; left: 0; }
  .desktop-icon {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 90px; transition: background 0.15s ease;
  }
  .desktop-icon:hover { background: rgba(51, 206, 214, 0.1); }
  .desktop-icon:active { background: rgba(51, 206, 214, 0.2); }
  .desktop-icon .icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 36px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .desktop-icon .label { font-size: 11px; text-align: center; color: var(--text-bright); text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.5); line-height: 1.3; }

  .window {
    position: absolute; min-width: 420px; min-height: 300px;
    background: var(--window-bg); border: 1px solid var(--window-border);
    border-radius: 8px 8px 4px 4px; box-shadow: var(--shadow-window);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; transform: scale(0.92) translateY(10px);
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
  }
  .window.open { opacity: 1; transform: scale(1) translateY(0); }
  .window.closing { opacity: 0; transform: scale(0.95) translateY(8px); transition: opacity 0.15s cubic-bezier(0.55,0,1,0.45), transform 0.15s cubic-bezier(0.55,0,1,0.45); }
  .window.focused { z-index: 100; box-shadow: var(--shadow-window-active); border-color: var(--window-border-glow); }
  .window:not(.focused) .window-header { background: var(--window-header-inactive); }

  .window-header {
    background: var(--window-header); padding: 0 4px; display: flex; align-items: center;
    height: 36px; flex-shrink: 0; cursor: grab; border-bottom: 1px solid rgba(51,206,214,0.1);
  }
  .window-header:active { cursor: grabbing; }
  .window-header .window-icon { width: 18px; height: 18px; margin: 0 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .window-title { flex: 1; font-size: 12px; font-weight: 700; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.3px; }
  .window-controls { display: flex; gap: 6px; padding-right: 6px; }
  .window-controls button { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; transition: transform 0.15s ease, filter 0.15s ease; }
  .window-controls button:hover { transform: scale(1.2); filter: brightness(1.3); }
  .window-controls .btn-close { background: var(--btn-close); }
  .window-controls .btn-max { background: var(--btn-max); }
  .window-controls .btn-min { background: var(--btn-min); }

  .window-addressbar {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 11px; color: var(--text-dim); flex-shrink: 0;
  }
  .window-addressbar .address { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 3px; padding: 3px 8px; color: var(--text); font-size: 11px; font-family: 'Tahoma', monospace; }
  .addressbar-btn { background: none; border: 1px solid rgba(255,255,255,0.08); color: var(--text-dim); padding: 2px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; transition: all 0.15s ease; }
  .addressbar-btn:hover { background: rgba(51,206,214,0.1); border-color: var(--accent-dim); color: var(--accent); }

  .window-body { flex: 1; display: flex; overflow: hidden; }

  .explorer-sidebar { width: 180px; background: var(--explorer-sidebar); border-right: 1px solid rgba(255,255,255,0.04); padding: 8px 0; overflow-y: auto; flex-shrink: 0; }
  .sidebar-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; padding: 8px 12px 4px; }
  .sidebar-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 11px; color: var(--text-dim); cursor: pointer; transition: all 0.12s ease; border-left: 2px solid transparent; }
  .sidebar-item:hover { background: var(--item-hover); color: var(--text); }
  .sidebar-item.active { background: var(--item-selected); color: var(--accent); border-left-color: var(--accent); }
  .sidebar-item .si-icon { font-size: 14px; width: 18px; text-align: center; }

  .explorer-content { flex: 1; overflow-y: auto; padding: 12px; }
  .explorer-content::-webkit-scrollbar { width: 8px; }
  .explorer-content::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  .explorer-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

  .file-list-header { display: grid; grid-template-columns: 24px 1fr 120px 80px; gap: 8px; padding: 4px 8px; font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 2px; }
  .file-item { display: grid; grid-template-columns: 24px 1fr 120px 80px; gap: 8px; padding: 6px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; transition: all 0.12s ease; align-items: center; }
  .file-item:hover { background: var(--item-hover); }
  .file-item .file-icon { font-size: 16px; text-align: center; }
  .file-item .file-name { color: var(--text); font-weight: 600; }
  .file-item .file-type { color: var(--text-dim); font-size: 11px; }
  .file-item .file-size { color: var(--text-dim); font-size: 11px; text-align: right; }

  .software-detail { animation: fadeSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .detail-hero {
    background: linear-gradient(135deg, rgba(51,206,214,0.08) 0%, rgba(15,31,58,0.4) 100%);
    border: 1px solid rgba(51,206,214,0.12); border-radius: 8px; padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .detail-hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(51,206,214,0.06) 0%, transparent 70%); pointer-events: none; }
  .detail-hero h2 { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 4px; letter-spacing: -0.3px; }

  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 13px; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .detail-section h3 .section-icon { color: var(--accent); font-size: 14px; }
  .detail-section p, .detail-section li { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .detail-section ul { list-style: none; padding: 0; }
  .detail-section li { padding: 3px 0 3px 16px; position: relative; }
  .detail-section li::before { content: '\203A'; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }

  .screenshot-preview { border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin: 12px 0; background: rgba(0,0,0,0.3); }
  .screenshot-preview img { width: 100%; height: auto; display: block; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .screenshot-preview:hover img { transform: scale(1.02); }

  /* ============================================
     WAVEFORM SLIDER COMPARISON
     ============================================ */
  .waveform-compare { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 16px; margin: 12px 0; }
  .waveform-slider-wrap {
    position: relative; width: 100%; height: 120px; overflow: hidden; border-radius: 4px;
    cursor: ew-resize; background: #080c14;
  }
  .waveform-slider-wrap canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #wf-canvas-after { z-index: 1; }
  #wf-canvas-before { z-index: 2; }
  .wf-slider-line {
    position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 4;
    pointer-events: none; left: 50%;
  }
  .wf-slider-handle {
    position: absolute; top: 50%; width: 28px; height: 28px; z-index: 5;
    background: #fff; border-radius: 50%; transform: translate(-50%, -50%);
    pointer-events: none; left: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
  }
  .wf-slider-handle::before { content: '\u25C0\u25B6'; font-size: 8px; color: #333; letter-spacing: -1px; }
  .wf-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; font-weight: 700; }
  .wf-labels .wf-before { color: #ff6b6b; }
  .wf-labels .wf-after { color: var(--accent); }
  .waveform-subtext { font-size: 10px; color: var(--text-dim); margin-top: 6px; font-style: italic; text-align: center; }

  /* ============================================
     SRVA INTERACTIVE
     ============================================ */
  .srva-interactive { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; margin: 12px 0; overflow: hidden; height: 240px; position: relative; cursor: pointer; }
  .srva-interactive canvas { width: 100%; height: 100%; display: block; }

  .why-use { background: rgba(51,206,214,0.04); border: 1px solid rgba(51,206,214,0.08); border-radius: 6px; padding: 14px; margin: 12px 0; }
  .why-use h4 { font-size: 11px; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .why-use p { font-size: 12px; color: var(--text-dim); line-height: 1.7; }

  .download-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 14px 20px; background: var(--download-btn);
    border: none; border-radius: 6px; color: var(--text-bright);
    font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
    letter-spacing: 0.3px; text-decoration: none;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .download-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(51,206,214,0.3); filter: brightness(1.1); }
  .download-btn:active { transform: translateY(0); }
  .download-btn .dl-icon { font-size: 18px; }

  .about-card {
    background: linear-gradient(135deg, rgba(51,206,214,0.05) 0%, rgba(10,14,26,0.5) 100%);
    border: 1px solid rgba(51,206,214,0.1); border-radius: 8px; padding: 20px; margin-bottom: 12px;
    animation: fadeSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .about-card h2 { font-size: 18px; color: var(--accent); margin-bottom: 10px; }
  .about-card p { font-size: 12px; line-height: 1.8; color: var(--text-dim); }
  .about-links { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .about-link { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; background: rgba(51,206,214,0.08); border: 1px solid rgba(51,206,214,0.15); border-radius: 4px; color: var(--accent); font-size: 11px; font-weight: 600; text-decoration: none; transition: all 0.15s ease; }
  .about-link:hover { background: rgba(51,206,214,0.15); transform: translateY(-1px); }

  #taskbar { position: fixed; bottom: 0; left: 0; right: 0; height: 48px; background: var(--taskbar-bg); border-top: 1px solid rgba(51,206,214,0.1); display: flex; align-items: center; padding: 0 4px; z-index: 10000; backdrop-filter: blur(10px); }
  .start-btn { display: flex; align-items: center; gap: 6px; padding: 6px 16px; margin-right: 6px; background: linear-gradient(180deg, #1e4d2e 0%, #15803d 50%, #166534 100%); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: var(--text-bright); font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: filter 0.15s ease; letter-spacing: 0.5px; }
  .start-btn:hover { filter: brightness(1.2); }
  .start-btn .start-icon { font-size: 18px; }
  .taskbar-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.08); margin: 0 4px; }
  .taskbar-items { display: flex; flex: 1; gap: 2px; overflow-x: auto; padding: 0 4px; }
  .taskbar-item { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 3px; font-size: 11px; color: var(--text-dim); cursor: pointer; white-space: nowrap; transition: all 0.15s ease; max-width: 180px; }
  .taskbar-item:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .taskbar-item.active { background: rgba(51,206,214,0.12); border-color: rgba(51,206,214,0.2); color: var(--accent); }
  .taskbar-item .tb-icon { font-size: 14px; }
  .taskbar-clock { padding: 0 16px; font-size: 11px; color: var(--text-dim); border-left: 1px solid rgba(255,255,255,0.06); height: 100%; display: flex; align-items: center; font-variant-numeric: tabular-nums; }

  #boot-screen { position: fixed; inset: 0; background: #020408; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
  #boot-screen.hidden { opacity: 0; pointer-events: none; }
  .boot-logo { font-family: 'Pixelify Sans', monospace; font-size: 28px; color: var(--accent); margin-bottom: 30px; letter-spacing: 2px; }
  .boot-progress { width: 240px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
  .boot-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; animation: bootLoad 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes bootLoad { 0% { width: 0%; } 30% { width: 40%; } 60% { width: 70%; } 100% { width: 100%; } }
  .boot-text { font-size: 11px; color: var(--text-dim); margin-top: 14px; font-family: 'Tahoma', monospace; }

  @media (max-width: 768px) {
    .explorer-sidebar { display: none; }
    .window { min-width: 320px; }
    .file-list-header, .file-item { grid-template-columns: 24px 1fr 80px; }
    .file-item .file-type { display: none; }
  }
</style>
</head>
<body>

<div id="boot-screen">
  <div class="boot-logo">KrasenOS</div>
  <div class="boot-progress"><div class="boot-progress-bar"></div></div>
  <div class="boot-text">Loading desktop...</div>
</div>

<div id="desktop">
  <div class="desktop-icons">
    <div class="desktop-icon" ondblclick="openWindow('about')">
      <div class="icon">&#x1F4C1;</div>
      <div class="label">About Me</div>
    </div>
    <div class="desktop-icon" ondblclick="openWindow('software')">
      <div class="icon">&#x1F4C2;</div>
      <div class="label">My Software</div>
    </div>
  </div>
</div>

<div id="taskbar">
  <button class="start-btn"><span class="start-icon">&#x229E;</span> Start</button>
  <div class="taskbar-divider"></div>
  <div class="taskbar-items" id="taskbar-items"></div>
  <div class="taskbar-clock" id="clock"></div>
</div>

// ============================================
// DYNAMIC TIME CALCULATION
// ============================================
function getTimeSince(startDateStr) {
  const start = new Date(startDateStr);
  const now = new Date();
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if (days < 0) {
    months--;
    const prev = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prev.getDate();
  }
  if (months < 0) { years--; months += 12; }
  let parts = [];
  if (years > 0) parts.push(years + ' year' + (years !== 1 ? 's' : ''));
  if (months > 0) parts.push(months + ' month' + (months !== 1 ? 's' : ''));
  if (days > 0) parts.push(days + ' day' + (days !== 1 ? 's' : ''));
  if (parts.length === 0) return 'today';
  if (parts.length === 1) return parts[0];
  if (parts.length === 2) return parts[0] + ' and ' + parts[1];
  return parts[0] + ', ' + parts[1] + ', and ' + parts[2];
}

// ============================================
// WAVEFORM SLIDER (before/after drag comparison)
// ============================================
function initWaveformSlider() {
  const wrap = document.getElementById('wf-slider-wrap');
  const cBefore = document.getElementById('wf-canvas-before');
  const cAfter = document.getElementById('wf-canvas-after');
  const line = document.getElementById('wf-line');
  const handle = document.getElementById('wf-handle');
  if (!wrap || !cBefore || !cAfter) return;

  const rect = wrap.getBoundingClientRect();
  const dpr = 2;
  [cBefore, cAfter].forEach(c => { c.width = rect.width * dpr; c.height = rect.height * dpr; });

  function drawWaveform(canvas, data, color) {
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const w = rect.width, h = rect.height, mid = h / 2;
    ctx.clearRect(0, 0, w, h);
    const barW = w / data.length;
    for (let i = 0; i < data.length; i++) {
      const val = data[i] * mid * 0.9;
      ctx.fillStyle = color;
      ctx.fillRect(i * barW, mid - val, Math.max(barW - 0.5, 1), val * 2);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();
  }

  drawWaveform(cBefore, WAVEFORM_BEFORE, 'rgba(255, 107, 107, 0.7)');
  drawWaveform(cAfter, WAVEFORM_AFTER, 'rgba(51, 206, 214, 0.7)');

  let sliderPos = 0.5;
  function updateClip() {
    const pct = sliderPos * 100;
    cBefore.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    cAfter.style.clipPath = `inset(0 0 0 ${pct}%)`;
    line.style.left = pct + '%';
    handle.style.left = pct + '%';
  }
  updateClip();

  let dragging = false;
  function onMove(e) {
    if (!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    sliderPos = Math.max(0, Math.min(1, x / rect.width));
    updateClip();
  }
  wrap.addEventListener('mousedown', (e) => { dragging = true; onMove(e); });
  wrap.addEventListener('touchstart', (e) => { dragging = true; onMove(e); }, { passive: true });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('mouseup', () => { dragging = false; });
  document.addEventListener('touchend', () => { dragging = false; });
}

    { r: 0, c: 3 },
    { r: 3, c: 3 },
    { r: 3, c: 0 },
    { r: 1, c: 2 },
    { r: 2, c: 1 },
  ];

  // Per-action timing (frames at 60fps)
  const SETTLE = 2;      // ~33ms cursor sits before click
  const PAUSE = 9;       // ~150ms after cell highlights before box moves
  const SNAP = 12;       // ~200ms box travel
  const HOLD = 30;       // ~500ms hold before next action
  const FIRST_MOVE = 60; // ~1s cursor travel for first click
  const MOVE = 40;       // ~667ms cursor travel for subsequent

  // Precompute frame ranges for each action
  let actions = [];
  let totalFrames = 0;
  CLICKS.forEach((click, i) => {
    const moveF = i === 0 ? FIRST_MOVE : MOVE;
    const start = totalFrames;
    actions.push({
      r: click.r, c: click.c,
      start,
      moveEnd: start + moveF,
      settleEnd: start + moveF + SETTLE,
      pauseEnd: start + moveF + SETTLE + PAUSE,
      snapEnd: start + moveF + SETTLE + PAUSE + SNAP,
      holdEnd: start + moveF + SETTLE + PAUSE + SNAP + HOLD,
    });
    totalFrames = start + moveF + SETTLE + PAUSE + SNAP + HOLD;
  });
  totalFrames += 30; // extra pause before loop

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

  function gridCellCenter(r, c) {
    return { x: gridAreaX + c * cellW + cellW * 0.35, y: topY + r * cellH + cellH * 0.45 };
  }

  function drawCursor(x, y) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 22);
    ctx.lineTo(x + 5, y + 17);
    ctx.lineTo(x + 9, y + 24);
    ctx.lineTo(x + 12, y + 22.5);
    ctx.lineTo(x + 7.5, y + 15);
    ctx.lineTo(x + 14, y + 15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Global frame counter; -1 = still
  let frame = -1;

  function drawScene(gf) {
    ctx.clearRect(0, 0, w, h);

    // -- SIDEBAR --
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, 0, sidebarW, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.strokeRect(0, 0, sidebarW, h);
    gridSizes.forEach((label, i) => {
      const y = 20 + i * 48;
      ctx.beginPath(); ctx.arc(16, y, 7, 0, Math.PI * 2);
      if (i === selectedGrid) {
        ctx.fillStyle = '#33CED6'; ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(16, y, 3, 0, Math.PI * 2); ctx.fill();
      } else { ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.fillStyle = i === selectedGrid ? '#fff' : '#999';
      ctx.font = 'bold 13px Tahoma';
      ctx.fillText(label, 28, y + 5);
    });

    // -- Figure out current action and blue box position --
    let activeIdx = -1;
    for (let i = actions.length - 1; i >= 0; i--) {
      if (gf >= actions[i].start) { activeIdx = i; break; }
    }

    // Which cell is currently "selected" (highlighted in grid)?
    // = the last action whose cell has been clicked (past settleEnd)
    let selectedCell = null;
    for (let i = 0; i <= activeIdx; i++) {
      if (gf >= actions[i].settleEnd) {
        selectedCell = { r: actions[i].r, c: actions[i].c };
      }
    }

    // -- GRID CELLS --
    ctx.fillStyle = '#000';
    ctx.fillRect(gridAreaX, topY, gridW, areaH);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cx = gridAreaX + c * cellW + cellPad;
        const cy = topY + r * cellH + cellPad;
        if (selectedCell && r === selectedCell.r && c === selectedCell.c) {
          ctx.fillStyle = 'rgba(120, 220, 255, 0.55)';
        } else {
          ctx.fillStyle = '#e8e8e8';
        }
        ctx.fillRect(cx, cy, cellW - cellPad * 2, cellH - cellPad * 2);
      }
    }

    // -- PREVIEW --
    // Yellow background: revealed after first box shrinks
    const firstAction = actions[0];
    let firstShrinkDone = gf >= firstAction.snapEnd;
    let firstShrinkProgress = 0;
    if (gf > firstAction.pauseEnd) {
      firstShrinkProgress = Math.min(1, (gf - firstAction.pauseEnd) / SNAP);
      firstShrinkProgress = easeOutQuart(firstShrinkProgress);
    }

    if (firstShrinkProgress > 0) {
      ctx.fillStyle = `rgba(241, 196, 15, ${Math.min(1, firstShrinkProgress) * 0.9})`;
      ctx.fillRect(previewX, topY, previewW, areaH);
      ctx.strokeStyle = `rgba(220, 180, 20, ${Math.min(1, firstShrinkProgress) * 0.8})`;
      ctx.lineWidth = pvBorder;
      ctx.strokeRect(previewX + pvBorder / 2, topY + pvBorder / 2, previewW - pvBorder, areaH - pvBorder);
    }

    // Blue box position: compute where it currently is
    let blueX, blueY, blueW, blueH;

    if (activeIdx === 0) {
      // First action: shrink from full preview to cell position
      const a = actions[0];
      const targetPvX = previewX + a.c * pvCellW;
      const targetPvY = topY + a.r * pvCellH;
      blueX = previewX + (targetPvX - previewX) * firstShrinkProgress;
      blueY = topY + (targetPvY - topY) * firstShrinkProgress;
      blueW = previewW - (previewW - pvCellW) * firstShrinkProgress;
      blueH = areaH - (areaH - pvCellH) * firstShrinkProgress;
    } else {
      // Subsequent actions: box moves from previous cell to new cell
      const a = actions[activeIdx];
      const prev = actions[activeIdx - 1];
      const fromPvX = previewX + prev.c * pvCellW;
      const fromPvY = topY + prev.r * pvCellH;
      const toPvX = previewX + a.c * pvCellW;
      const toPvY = topY + a.r * pvCellH;

      let moveP = 0;
      if (gf > a.pauseEnd) {
        moveP = Math.min(1, (gf - a.pauseEnd) / SNAP);
        moveP = easeOutQuart(moveP);
      }

      blueX = fromPvX + (toPvX - fromPvX) * moveP;
      blueY = fromPvY + (toPvY - fromPvY) * moveP;
      blueW = pvCellW;
      blueH = pvCellH;
    }

    ctx.fillStyle = '#42b4f5';
    ctx.fillRect(blueX, blueY, blueW, blueH);
    ctx.strokeStyle = 'rgba(150, 210, 255, 0.8)';
    ctx.lineWidth = pvBorder;
    ctx.strokeRect(blueX + pvBorder / 2, blueY + pvBorder / 2, blueW - pvBorder, blueH - pvBorder);

    // -- CURSOR --
    if (activeIdx >= 0) {
      const a = actions[activeIdx];
      // Only show cursor during move + settle + pause + snap of current action
      if (gf <= a.snapEnd + 5) {
        let fromPos;
        if (activeIdx === 0) {
          fromPos = { x: gridAreaX + gridW * 0.55, y: topY + areaH * 0.55 };
        } else {
          fromPos = gridCellCenter(actions[activeIdx - 1].r, actions[activeIdx - 1].c);
        }
        const toPos = gridCellCenter(a.r, a.c);
        const moveDuration = a.moveEnd - a.start;
        const moveT = Math.min(1, (gf - a.start) / moveDuration);

        const cx = fromPos.x + (toPos.x - fromPos.x) * easeOutCubic(moveT);
        const cy = fromPos.y + (toPos.y - fromPos.y) * easeOutCubic(moveT);
        drawCursor(cx, cy);
      }
    }

    // -- HINT --
    if (gf < 0) {
      ctx.fillStyle = '#5a6580';
      ctx.font = '11px Tahoma';
      ctx.textAlign = 'center';
      ctx.fillText('\u{1F5B1}\uFE0F Hover to see it in action', w / 2, h - 6);
      ctx.textAlign = 'left';
    }
  }

  function drawStill() {
    ctx.clearRect(0, 0, w, h);

    // Sidebar
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, 0, sidebarW, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.strokeRect(0, 0, sidebarW, h);
    gridSizes.forEach((label, i) => {
      const y = 20 + i * 48;
      ctx.beginPath(); ctx.arc(16, y, 7, 0, Math.PI * 2);
      if (i === selectedGrid) {
        ctx.fillStyle = '#33CED6'; ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(16, y, 3, 0, Math.PI * 2); ctx.fill();
      } else { ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.fillStyle = i === selectedGrid ? '#fff' : '#999';
      ctx.font = 'bold 13px Tahoma';
      ctx.fillText(label, 28, y + 5);
    });

    // Grid (all white)
    ctx.fillStyle = '#000';
    ctx.fillRect(gridAreaX, topY, gridW, areaH);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        ctx.fillStyle = '#e8e8e8';
        ctx.fillRect(gridAreaX + c * cellW + cellPad, topY + r * cellH + cellPad, cellW - cellPad * 2, cellH - cellPad * 2);
      }
    }

    // Blue fills entire preview
    ctx.fillStyle = '#42b4f5';
    ctx.fillRect(previewX, topY, previewW, areaH);
    ctx.strokeStyle = 'rgba(150, 210, 255, 0.8)';
    ctx.lineWidth = pvBorder;
    ctx.strokeRect(previewX + pvBorder / 2, topY + pvBorder / 2, previewW - pvBorder, areaH - pvBorder);

    // Hint
    ctx.fillStyle = '#5a6580';
    ctx.font = '11px Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F5B1}\uFE0F Hover to see it in action', w / 2, h - 6);
    ctx.textAlign = 'left';
  }

  function animate() {
    if (isHovering && !reversing) {
      if (frame < 0) frame = 0;
      else frame++;
      if (frame >= totalFrames) frame = 0; // loop
    } else if (!isHovering) {
      if (frame >= 0) {
        reversing = true;
        reverseAlpha -= 0.05;
        if (reverseAlpha <= 0) {
          frame = -1;
          reversing = false;
          reverseAlpha = 1;
        }
      }
    }

    if (reversing) {
      ctx.globalAlpha = reverseAlpha;
      drawScene(frame);
      ctx.globalAlpha = 1 - reverseAlpha;
      drawStill();
      ctx.globalAlpha = 1;
    } else if (frame < 0) {
      drawStill();
    } else {
      drawScene(frame);
    }

    requestAnimationFrame(animate);
  }

  container.addEventListener('mouseenter', () => { isHovering = true; reversing = false; reverseAlpha = 1; });
  container.addEventListener('mouseleave', () => { isHovering = false; });

  drawStill();
  animate();
}

    const contentEl = document.getElementById('content-software');
    const titleEl = document.getElementById('title-software');
    const addrEl = document.getElementById('address-software');
    const backBtn = document.getElementById('back-software');
    contentEl.innerHTML = getSoftwareListView();
    titleEl.textContent = 'My Software';
    addrEl.textContent = 'C:\\Users\\Krasen\\Software';

function focusWindow(id) {
  Object.values(windows).forEach(w => w.el.classList.remove('focused'));
  windows[id].el.classList.add('focused');
  windows[id].el.style.zIndex = ++zCounter;
  document.querySelectorAll('.taskbar-item').forEach(el => el.classList.remove('active'));
  const tbItem = document.getElementById(`tb-${id}`);
  if (tbItem) tbItem.classList.add('active');
}

function closeWindow(id) {
  const win = windows[id]; if (!win) return;
  win.el.classList.remove('open'); win.el.classList.add('closing');
  setTimeout(() => { win.el.remove(); delete windows[id]; const t = document.getElementById(`tb-${id}`); if (t) t.remove(); }, 150);
}

function minimizeWindow(id) {
  const win = windows[id]; if (!win) return;
  if (win.minimized) {
    win.el.style.display = 'flex';
    requestAnimationFrame(() => { win.el.classList.add('open'); win.minimized = false; focusWindow(id); });
  } else {
    win.el.classList.remove('open');
    setTimeout(() => { win.el.style.display = 'none'; win.minimized = true; }, 150);
  }
}

function addTaskbarItem(id, icon, title) {
  const container = document.getElementById('taskbar-items');
  const item = document.createElement('div');
  item.className = 'taskbar-item'; item.id = `tb-${id}`;
  item.innerHTML = `<span class="tb-icon">${icon}</span> ${title}`;
  item.onclick = () => { if (windows[id].minimized) minimizeWindow(id); else focusWindow(id); };
  container.appendChild(item);
}

function startDrag(e, id) {
  if (e.target.tagName === 'BUTTON') return;
  focusWindow(id);
  const win = windows[id].el; const r = win.getBoundingClientRect();
  dragState = { id, offsetX: e.clientX - r.left, offsetY: e.clientY - r.top };
  e.preventDefault();
}
document.addEventListener('mousemove', (e) => { if (!dragState) return; const w = windows[dragState.id]?.el; if (!w) return; w.style.left = (e.clientX - dragState.offsetX) + 'px'; w.style.top = (e.clientY - dragState.offsetY) + 'px'; });
document.addEventListener('mouseup', () => { dragState = null; });
document.getElementById('desktop').addEventListener('mousedown', (e) => {
  if (e.target === document.getElementById('desktop')) {
    Object.values(windows).forEach(w => w.el.classList.remove('focused'));
    document.querySelectorAll('.taskbar-item').forEach(el => el.classList.remove('active'));
  }
});

function updateClock() {
  const now = new Date(); const h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h%12||12}:${m} ${h>=12?'PM':'AM'}`;
}
updateClock(); setInterval(updateClock, 30000);
setTimeout(() => { document.getElementById('boot-screen').classList.add('hidden'); }, 2200);
