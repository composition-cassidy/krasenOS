  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font: "Segoe UI", "Open Sans", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --tb: 40px;                       /* taskbar height */
    --glass: 118, 176, 236;           /* frame tint */
    --ink: #1a1a1a;
    --ink-2: #56606d;
    --heading: #0c3a8e;
    --link: #0b5fc4;
    --line: #dde3ea;
    --sel-a: #dcebfc; --sel-b: #c1dbfc; --sel-line: #7da2ce;
    --hot-a: #fafcff; --hot-b: #e8f2fd; --hot-line: #b8d6fb;
    --oc: #0075e8; --oc-deep: #081e63;
  }

  html, body { height: 100%; }
  body {
    font: 12px/1.4 var(--font); color: var(--ink);
    background: #0b3f8c; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: default;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
  input { font: inherit; color: inherit; }
  a { color: var(--link); }
  ::selection { background: #3399ff; color: #fff; }
  .selectable { -webkit-user-select: text; user-select: text; cursor: auto; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .ico { flex: none; display: block; }
  :focus { outline: none; }
  :focus-visible { outline: 1px dotted #000; outline-offset: -2px; }

  /* Scrollbars, in the era's pale two-tone */
  .scroll { scrollbar-width: auto; scrollbar-color: #c3cbd6 #f1f3f6; }
  .scroll::-webkit-scrollbar { width: 17px; height: 17px; }
  .scroll::-webkit-scrollbar-track { background: linear-gradient(90deg, #e9ecf0, #f6f7f9 40%, #f6f7f9); }
  .scroll::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #f7f8fa, #dfe4ea 48%, #cfd6de 52%, #dde2e8); border: 1px solid #9aa3af; border-radius: 3px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: linear-gradient(90deg, #eaf5ff, #c9e4fb 48%, #add6f8 52%, #c5e2fa); border-color: #3c7fb1; }

  /* ---------- Account picture frame ---------- */
  .tile {
    --s: 48px; flex: none; display: inline-block; width: var(--s); height: var(--s); padding: calc(var(--s) * .09); border-radius: calc(var(--s) * .11);
    background: linear-gradient(140deg, rgba(255,255,255,.96), rgba(214,228,243,.9) 46%, rgba(160,190,226,.86));
    border: 1px solid rgba(24,44,78,.72);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.85), 0 2px 8px rgba(0,0,0,.38);
  }
  .tile img { display: block; width: 100%; height: 100%; background: #fff; border: 1px solid rgba(24,44,78,.55); border-radius: 2px; }
  .tile.small { padding: 1px; border-radius: 2px; box-shadow: none; }
  .tile.small img { border: 0; border-radius: 1px; }

  /* ---------- Welcome screen ---------- */
  #welcome {
    position: fixed; inset: 0; z-index: 99999; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(120% 95% at 50% 42%, #2f8bdc 0%, #155fb8 36%, #08357a 70%, #041d4a 100%);
    transition: opacity .55s ease, visibility 0s linear .55s;
  }
  #welcome.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .wl-tile { --s: 132px; }
  .wl-name { font-size: 22px; margin-top: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .wl-status { display: flex; align-items: center; gap: 12px; margin-top: 30px; font-size: 18px; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .wl-ring { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.22); border-top-color: #fff; border-right-color: rgba(255,255,255,.75); animation: spin .9s linear infinite; }
  .wl-brand { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 19px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Desktop ---------- */
  #wallpaper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #desktop { position: fixed; left: 0; right: 0; top: 0; bottom: var(--tb); }
  .desktop-icons { position: absolute; top: 8px; left: 6px; display: flex; flex-direction: column; gap: 6px; }
  .dicon {
    width: 86px; padding: 6px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    border: 1px solid transparent; border-radius: 3px; color: #fff; text-align: center; line-height: 1.25;
    text-shadow: 0 1px 2px #000, 0 0 5px rgba(0,0,0,.75);
  }
  .dicon:hover { background: linear-gradient(rgba(190,220,255,.3), rgba(150,195,250,.2)); border-color: rgba(205,228,255,.5); }
  .dicon.sel { background: linear-gradient(rgba(170,210,255,.5), rgba(120,175,245,.38)); border-color: rgba(205,228,255,.8); }
  .dicon:focus-visible { outline: 1px dotted #fff; outline-offset: -3px; }
  .dicon .ico, .dicon .tile { filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }

  /* ---------- Glass ---------- */
  .glass {
    background:
      linear-gradient(112deg, transparent 0 16%, rgba(255,255,255,.2) 20% 27%, transparent 31% 44%, rgba(255,255,255,.13) 48% 58%, transparent 62% 76%, rgba(255,255,255,.1) 80% 84%, transparent 88%) fixed,
      linear-gradient(rgba(var(--glass), .5), rgba(var(--glass), .32));
    -webkit-backdrop-filter: blur(9px) saturate(1.35); backdrop-filter: blur(9px) saturate(1.35);
  }

  /* ---------- Windows ---------- */
  .window {
    position: absolute; display: flex; flex-direction: column; min-width: 340px; min-height: 260px;
    padding: 0 7px 7px; border-radius: 8px;
    border: 1px solid rgba(14,28,52,.78);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), 0 4px 14px rgba(0,0,0,.3);
    opacity: 0; transform: scale(.955);
    transition: opacity .16s ease-out, transform .18s cubic-bezier(.16,1,.3,1), box-shadow .15s ease;
  }
  .window.open { opacity: 1; transform: none; }
  .window.leaving { opacity: 0; transform: scale(.96); transition-duration: .12s; }
  .window.minimizing { opacity: 0; transform: translateY(26px) scale(.9); transition: opacity .15s ease-in, transform .17s ease-in; }
  .window.focused { box-shadow: inset 0 0 0 1px rgba(255,255,255,.62), 0 16px 44px rgba(0,0,0,.52), 0 3px 10px rgba(0,0,0,.36); }
  .window:not(.focused) { --glass: 168, 196, 226; }
  .window:not(.focused) .title { color: #3b4350; }
  .window.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; padding: 0; border-width: 0 0 1px; }
  .window.max .glasshead { padding: 0 6px; }

  .glasshead { flex: none; touch-action: none; }
  .titlebar { height: 29px; display: flex; align-items: center; gap: 6px; padding-left: 2px; position: relative; }
  .title { flex: 1; min-width: 0; font-size: 12px; font-weight: 400; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 9px #fff, 0 0 6px #fff, 0 0 4px rgba(255,255,255,.95), 0 0 2px #fff; padding: 2px 4px; }

  .caption { align-self: flex-start; display: flex; margin: -1px -1px 0 0; border: 1px solid rgba(18,30,54,.78); border-top: 0; border-radius: 0 0 5px 5px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
  .cap { height: 19px; display: grid; place-items: center; border-right: 1px solid rgba(18,30,54,.6);
    background: linear-gradient(rgba(255,255,255,.62), rgba(255,255,255,.3) 46%, rgba(255,255,255,.06) 50%, rgba(255,255,255,.28)); }
  .cap:last-child { border-right: 0; }
  .cap svg { display: block; }
  .cap-min { width: 28px; } .cap-max { width: 26px; } .cap-close { width: 46px; }
  .cap:hover { background: linear-gradient(#d6ecff, #9cd0fb 46%, #55aef2 50%, #a5e0ff); box-shadow: inset 0 0 6px #fff; }
  .cap:active { background: linear-gradient(#a9c8e4, #5f93c3 46%, #2d6ba6 50%, #5fa6cf); }

    background: linear-gradient(#fff, #f3f6fa); box-shadow: inset 0 1px 2px rgba(0,0,0,.14), 0 0 0 1px rgba(255,255,255,.34);

  .cmdbar { flex: none; height: 31px; display: flex; align-items: center; gap: 2px; padding: 0 6px;
    background: linear-gradient(#fbfdff, #edf3fa 48%, #dfe8f4 52%, #e7eef8); border-bottom: 1px solid #b4c2d6; color: #1e395b; }

  .body { flex: 1; min-height: 0; display: flex; }

  .content { flex: 1; min-width: 0; overflow: auto; background: #fff; }

  /* Details view */

  /* Pages (software detail, about) */

  .page-head { display: flex; align-items: center; gap: 14px; }

  .page-head p { color: var(--ink-2); margin-top: 2px; }

  .preview { margin-top: 18px; }
  .shot { display: block; width: calc(100% - 10px); max-width: 660px; height: auto; margin: 5px; border: 1px solid #8f9cae; box-shadow: 0 0 0 4px #fff, 0 0 0 5px #c9d1db, 0 7px 16px rgba(0,0,0,.24); }

  .panel { position: relative; max-width: 670px; padding: 10px; border: 1px solid #55647a; border-radius: 3px; background: linear-gradient(#1c2636, #0b111b); box-shadow: inset 0 0 0 1px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.1); }

  .wf-thumb { position: absolute; top: 50%; left: 50%; width: 13px; height: 24px; margin: -12px 0 0 -6.5px; border: 1px solid #5f6b7b; border-radius: 3px; background: linear-gradient(90deg, #fdfdfe, #dfe5ec 50%, #c9d1db); box-shadow: 0 1px 4px rgba(0,0,0,.6), inset 0 0 0 1px #fff; }

  .grid-demo:focus-visible { outline: 1px dotted #fff; outline-offset: -3px; }

  .infobar { display: flex; align-items: flex-start; gap: 8px; max-width: 70ch; margin-top: 18px; padding: 8px 11px; background: #ffffe1; border: 1px solid #d6cc7c; font-size: 12.5px; line-height: 1.5; color: #1f1f1f; }
  .infobar .ico { margin-top: 1px; }

  .clink { display: inline-flex; align-items: flex-start; gap: 10px; margin: 22px 0 0 -10px; padding: 9px 18px 11px 10px; border: 1px solid transparent; border-radius: 3px; color: #12306e; text-decoration: none; cursor: pointer; }

  .clink:active { background: linear-gradient(#e4effb, #d2e4f8); border-color: #7da2ce; }
  .clink:focus-visible { outline: 1px dotted #000; outline-offset: -3px; }

  .about-head { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }

  .links { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; }
  .lnk { display: flex; align-items: center; gap: 9px; min-width: 190px; padding: 6px 12px 6px 6px; border: 1px solid transparent; border-radius: 3px; text-decoration: none; color: var(--ink); }
  .lnk b { display: block; font-weight: 400; font-size: 13px; color: var(--link); }
  .lnk small { display: block; font-size: 11.5px; color: var(--ink-2); }
  .lnk:hover { background: linear-gradient(var(--hot-a), var(--hot-b)); border-color: var(--hot-line); }
  .lnk:hover b { text-decoration: underline; }

  /* ---------- Taskbar ---------- */
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 9000; display: flex; align-items: stretch;
    background: linear-gradient(rgba(255,255,255,.36), rgba(255,255,255,.12) 46%, rgba(4,20,48,.2) 52%, rgba(4,20,48,.36)), rgba(28,72,138,.5);
    -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4);
    border-top: 1px solid rgba(6,18,40,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); color: #fff; }
  #start { flex: none; width: 60px; position: relative; }
  #start svg { position: absolute; left: 5px; bottom: -1px; width: 50px; height: 50px; overflow: visible; transition: filter .18s ease; filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
  #start:hover svg, #start[aria-expanded="true"] svg { filter: drop-shadow(0 0 7px rgba(150,215,255,.95)) brightness(1.14); }
  #start:active svg { filter: brightness(.9); }
  #start:focus-visible { outline: 1px dotted #fff; outline-offset: -3px; }
  #start .eye { transform-box: fill-box; transform-origin: center; }
  #start:hover .eye { animation: blink 2.6s .25s infinite; }
  @keyframes blink { 0%, 5%, 100% { transform: scaleY(1); } 2.5% { transform: scaleY(.12); } }

  .tasks { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 0 2px; }
  .tbtn { --mx: 50%; --hot: 150, 205, 255; position: relative; min-width: 62px; max-width: 180px; display: flex; align-items: center; gap: 8px; margin-top: 1px; padding: 0 12px;
    border: 1px solid transparent; border-radius: 3px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.75); white-space: nowrap; }
  .tbtn .tlabel { overflow: hidden; text-overflow: ellipsis; }
  .tbtn:not(.running) .tlabel { display: none; }
  .tbtn:not(.running) { justify-content: center; }
  .tbtn.running { border-color: rgba(255,255,255,.42); box-shadow: inset 0 0 0 1px rgba(8,24,52,.35);
    background: linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,.12) 48%, rgba(255,255,255,.02) 52%, rgba(255,255,255,.14)); }
  .tbtn.active { border-color: rgba(255,255,255,.72);
    background: linear-gradient(rgba(255,255,255,.52), rgba(255,255,255,.26) 48%, rgba(255,255,255,.1) 52%, rgba(255,255,255,.3)); }
  .tbtn:hover { border-color: rgba(255,255,255,.7);
    background: radial-gradient(70px 34px at var(--mx) 100%, rgba(var(--hot), .9), rgba(var(--hot), 0)), linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.16) 48%, rgba(255,255,255,.05) 52%, rgba(255,255,255,.2)); }
  .tbtn:focus-visible, .tray button:focus-visible { outline: 1px dotted #fff; outline-offset: -3px; }

  .tray { flex: none; display: flex; align-items: stretch; }
  #clock { padding: 0 10px; text-align: center; line-height: 1.32; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); border: 1px solid transparent; border-radius: 3px; margin: 1px 2px 0; font-variant-numeric: tabular-nums; }
  #clock:hover { border-color: rgba(255,255,255,.45); background: linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,.08)); }
  #clock span { display: block; }
  #showdesk { width: 15px; border-left: 1px solid rgba(8,22,48,.7); box-shadow: inset 1px 0 0 rgba(255,255,255,.4); background: linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,.06) 50%, rgba(255,255,255,.14)); }
  #showdesk:hover { background: linear-gradient(rgba(255,255,255,.7), rgba(190,225,255,.4) 50%, rgba(255,255,255,.5)); }

  /* ---------- Start menu ---------- */
  #startmenu { position: fixed; left: 0; bottom: var(--tb); z-index: 9100; width: 428px; max-width: 100vw; display: none; grid-template-columns: 1fr 164px; gap: 6px; padding: 7px 7px 6px;
    border: 1px solid rgba(10,24,48,.82); border-bottom: 0; border-radius: 8px 8px 0 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 -6px 30px rgba(0,0,0,.45); }
  #startmenu.open { display: grid; animation: rise .14s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .sm-left { display: flex; flex-direction: column; min-height: 372px; background: #fff; border: 1px solid rgba(16,32,60,.75); border-radius: 4px; overflow: hidden; }
  .sm-list { flex: 1; padding: 6px; }
  .sm-item { width: 100%; display: flex; align-items: center; gap: 9px; padding: 4px 6px; border: 1px solid transparent; border-radius: 3px; text-align: left; }
  .sm-item small { display: block; color: var(--ink-2); font-size: 11.5px; }

  .sm-all { display: flex; align-items: center; gap: 7px; width: calc(100% - 12px); margin: 0 6px; padding: 6px; border: 1px solid transparent; border-top-color: #dfe5ec; border-radius: 0 0 3px 3px; text-align: left; }
  .sm-all:hover, .sm-all:focus-visible { background: linear-gradient(var(--sel-a), var(--sel-b)); border-color: var(--sel-line); border-radius: 3px; outline: none; }
  .sm-search { margin: 6px; width: auto; }
  .sm-right { position: relative; display: flex; flex-direction: column; padding: 46px 0 2px; color: #fff; border-radius: 4px; background: linear-gradient(rgba(8,30,66,.42), rgba(8,30,66,.56)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .sm-tile { --s: 64px; position: absolute; top: -28px; left: 50%; margin-left: -32px; }
  .sm-link { display: block; width: calc(100% - 8px); margin: 0 4px; padding: 7px 9px; border: 1px solid transparent; border-radius: 3px; color: #fff; text-align: left; text-decoration: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .sm-link:hover, .sm-link:focus-visible { border-color: rgba(255,255,255,.55); background: linear-gradient(rgba(255,255,255,.38), rgba(255,255,255,.12) 50%, rgba(255,255,255,.2)); outline: none; }
  .sm-rule { height: 1px; margin: 6px 12px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.4), rgba(255,255,255,0)); }
  .sm-power { margin: auto 8px 6px auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; border: 1px solid rgba(8,20,44,.85); border-radius: 3px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
    background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.14) 48%, rgba(255,255,255,.03) 52%, rgba(255,255,255,.16)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  .sm-power:hover { background: linear-gradient(#bfe2ff, #76bdf5 48%, #3d97e6 52%, #7fd0ff); }
  .sm-power:focus-visible { outline: 1px dotted #fff; outline-offset: -3px; }

  noscript { position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center; padding: 24px; background: #0b3f8c; color: #fff; font-size: 15px; text-align: center; }
  noscript a { color: #cfe6ff; }

  /* ---------- Phones: every window is maximised ---------- */
  @media (max-width: 720px) {
    :root { --tb: 46px; }
    body { font-size: 13px; }
    .window { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; min-width: 0; border-radius: 0; padding: 0; border-width: 0; }
    .glasshead { padding: 0 6px; }
    .titlebar { height: 38px; }
    .title { font-size: 14px; }
    .cap { height: 29px; } .cap-min, .cap-max { width: 40px; } .cap-close { width: 52px; }
    .cap-max { display: none; }
    .trav { width: 32px; height: 32px; }
    .address { height: 32px; } .crumb { height: 28px; }
    .search, .npane, .taskpane, .dpane, .col-type, .files td:nth-child(2), .files th:nth-child(2) { display: none; }
    .client { border-width: 1px 0 0; box-shadow: none; }
    .cmdbar { height: 40px; } .cmd { height: 32px; }
    .files tbody td { height: 44px; } .files thead button { height: 32px; } .files thead th { height: 33px; }
    .col-size { width: 108px; }
    .page { padding: 16px 16px 26px; }

// ============================================
// DYNAMIC TIME CALCULATION
// ============================================
function getTimeSince(startDateStr) {
  const start = new Date(startDateStr);
  const now = new Date();
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if (days < 0) {
    months--;
    const prev = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prev.getDate();
  }
  if (months < 0) { years--; months += 12; }
  const parts = [];
  if (years > 0) parts.push(years + ' year' + (years !== 1 ? 's' : ''));
  if (months > 0) parts.push(months + ' month' + (months !== 1 ? 's' : ''));
  if (days > 0) parts.push(days + ' day' + (days !== 1 ? 's' : ''));
  if (parts.length === 0) return 'today';
  if (parts.length === 1) return parts[0];
  if (parts.length === 2) return parts[0] + ' and ' + parts[1];
  return parts[0] + ', ' + parts[1] + ', and ' + parts[2];
}

// ============================================
// LATEST XLETH RELEASE
// Asks GitHub once per session for the newest release tag, so the page
// never needs editing when a new version ships. If GitHub does not answer
// (offline, rate limit), the tag written in SOFTWARE.xleth stays.
// ============================================
function applyXlethRelease(rel) {
  if (!rel || !/^[\w.+-]{1,40}$/.test(rel.tag || '')) return;
  const x = SOFTWARE.xleth;
  x.version = rel.tag;
  if (rel.bytes > 0) { x.bytes = rel.bytes; x.size = '~' + Math.round(rel.bytes / 1e6) + ' MB'; }
  if (wins.software && (sw.view === 'list' || sw.view === 'xleth')) {
    const top = $('#sw-content').scrollTop;
    renderSoftware();
    $('#sw-content').scrollTop = top;
  }
}
async function loadXlethRelease() {
  const KEY = 'krasenos-xleth-release';
  try { const hit = JSON.parse(sessionStorage.getItem(KEY)); if (hit) { applyXlethRelease(hit); return; } } catch (err) { /* no cache, ask GitHub */ }
  try {
    const res = await fetch('https://api.github.com/repos/composition-cassidy/Xleth/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) return;
    const data = await res.json();
    const installers = (data.assets || []).filter(a => /\.(exe|msi|zip)$/i.test(a.name));
    const rel = { tag: data.tag_name, bytes: installers.reduce((m, a) => Math.max(m, a.size || 0), 0) };
    applyXlethRelease(rel);
    try { sessionStorage.setItem(KEY, JSON.stringify(rel)); } catch (err) { /* storage blocked: it just asks again next load */ }
  } catch (err) { /* offline or blocked: the built-in tag stays */ }
}

function openWindow(id) {
  if (wins[id]) { if (wins[id].min) restoreWindow(id); else focusWindow(id); return; }
  const a = APPS[id];
  const el = document.createElement('section');
  el.className = 'window glass'; el.id = `win-${id}`;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-labelledby', `title-${id}`);
  el.dataset.win = id;
  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  const w = Math.min(a.w, dw - 24), h = Math.min(a.h, dh - 20);
  el.style.width = w + 'px'; el.style.height = h + 'px';
  let x = a.x, y = a.y;
  if (id === 'software') { x = Math.max(12, Math.min(dw - w - 18, Math.round(dw * .5 - w * .34))); y = Math.max(8, Math.round((dh - h) * .62)); }
  el.style.left = Math.max(8, Math.min(x, dw - w - 8)) + 'px';
  el.style.top = Math.max(6, Math.min(y, dh - h - 6)) + 'px';
  el.innerHTML = frameHTML(id);
  desktop.appendChild(el);
  wins[id] = { el, min: false, max: false };
  if (id === 'about') $('#addr-about').innerHTML = crumbsHTML('about', [{ label: 'Krasen' }]);
  if (id === 'software') { renderSoftware(); observeDemoHost(); }
  requestAnimationFrame(() => { el.classList.add('open'); focusWindow(id); });
  renderTasks();
}

function focusWindow(id) {
  if (!wins[id]) return;
  for (const w of Object.values(wins)) w.el.classList.remove('focused');
  wins[id].el.classList.add('focused');
  wins[id].el.style.zIndex = ++zCounter;
  renderTasks();
}

function blurAll() {
  for (const w of Object.values(wins)) w.el.classList.remove('focused');
  renderTasks();
}

function closeWindow(id) {
  const w = wins[id]; if (!w) return;
  delete wins[id];
  if (id === 'software') { demo?.destroy(); demo = null; Object.assign(sw, { view: 'list', sel: null, q: '', back: [], fwd: [] }); }
  w.el.classList.remove('open'); w.el.classList.add('leaving');
  setTimeout(() => w.el.remove(), 130);
  focusTop();
}

function focusTop() {
  const open = Object.entries(wins).filter(([, w]) => !w.min).sort((a, b) => (+b[1].el.style.zIndex || 0) - (+a[1].el.style.zIndex || 0));
  if (open.length) focusWindow(open[0][0]); else renderTasks();
}

function minimizeWindow(id) {
  const w = wins[id]; if (!w || w.min) return;
  w.min = true;
  w.el.classList.remove('focused'); w.el.classList.add('minimizing');
  setTimeout(() => { if (w.min) w.el.style.display = 'none'; }, 170);
  focusTop();
}

function restoreWindow(id) {
  const w = wins[id]; if (!w) return;
  w.min = false; w.el.style.display = '';
  requestAnimationFrame(() => { w.el.classList.remove('minimizing'); focusWindow(id); });
}

function toggleMaximize(id) {
  const w = wins[id]; if (!w || compact.matches) return;
  w.max = !w.max;
  w.el.classList.toggle('max', w.max);
  const btn = $('.cap-max', w.el);
  btn.setAttribute('aria-label', w.max ? 'Restore' : 'Maximize');
  $('use', btn).setAttribute('href', w.max ? '#c-restore' : '#c-max');
}

// Dragging by the glass
let drag = null;
desktop.addEventListener('pointerdown', e => {
  const winEl = e.target.closest('.window');
  if (!winEl) { if (e.target === desktop || e.target.classList.contains('desktop-icons')) { blurAll(); $$('.dicon.sel').forEach(d => d.classList.remove('sel')); } return; }
  const id = winEl.dataset.win;
  if (!winEl.classList.contains('focused')) focusWindow(id);
  if (!e.target.closest('[data-drag]') || e.target.closest('button, input, a')) return;
  if (compact.matches || wins[id].max || e.button !== 0) return;
  const r = winEl.getBoundingClientRect();
  drag = { el: winEl, dx: e.clientX - r.left, dy: e.clientY - r.top, id: e.pointerId };
  e.target.closest('[data-drag]').setPointerCapture(e.pointerId);
  e.preventDefault();
});
desktop.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dw = desktop.clientWidth, dh = desktop.clientHeight, w = drag.el.offsetWidth;
  drag.el.style.left = Math.max(90 - w, Math.min(dw - 90, e.clientX - drag.dx)) + 'px';
  drag.el.style.top = Math.max(0, Math.min(dh - 30, e.clientY - drag.dy)) + 'px';
});
const endDrag = () => { drag = null; };
desktop.addEventListener('pointerup', endDrag);
desktop.addEventListener('pointercancel', endDrag);
desktop.addEventListener('dblclick', e => {
  const head = e.target.closest('[data-drag]');
  if (head && !e.target.closest('button, input, a')) toggleMaximize(head.closest('.window').dataset.win);
});

// Window buttons, breadcrumbs, cross-links
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) {
    const id = act.closest('.window')?.dataset.win;
    const a = act.dataset.act;
    if (a === 'close') closeWindow(id);
    else if (a === 'min') minimizeWindow(id);
    else if (a === 'max') toggleMaximize(id);
    else if (a === 'back') goBack();
    else if (a === 'fwd') goForward();
    return;
  }
  const crumb = e.target.closest('[data-crumb]');
  if (crumb) { const go = crumb.dataset.crumb; if (go === 'about') openWindow('about'); else navigate(go); return; }
  const opener = e.target.closest('[data-open]');
  if (opener && !opener.classList.contains('dicon')) { closeStart(); openWindow(opener.dataset.open); if (opener.dataset.open === 'software' && opener.classList.contains('sm-all')) navigate('list'); return; }
  const run = e.target.closest('[data-run]');
  if (run) { closeStart(); openSoftware(run.dataset.run); }
});

// Desktop icons: click selects, double-click or Enter opens, a tap opens
for (const d of $$('.dicon')) {
  d.addEventListener('click', e => {
    $$('.dicon.sel').forEach(o => o.classList.remove('sel'));

}

  renderSoftware();
  $('#sw-content').scrollTop = 0;
  focusWindow('software');
}
function goBack() { if (!sw.back.length) return; sw.fwd.push(sw.view); navigate(sw.back.pop(), false); }
function goForward() { if (!sw.fwd.length) return; sw.back.push(sw.view); navigate(sw.fwd.pop(), false); }

function visibleItems() {
  const q = sw.q.trim().toLowerCase();
  let keys = ORDER.filter(k => { const s = SOFTWARE[k]; return !q || (s.name + ' ' + s.type + ' ' + s.description).toLowerCase().includes(q); });
  if (sw.sort) {
    const { col, dir } = sw.sort;
    keys = [...keys].sort((a, b) => {
      const A = SOFTWARE[a], B = SOFTWARE[b];
      const c = col === 'size' ? A.bytes - B.bytes : A[col].localeCompare(B[col]);
      return dir * (c || A.name.localeCompare(B.name));
    });
  }
  return keys;
}

  if (!keys.length) return `<p class="empty">No items match your search.</p>`;

  const th = (col, label, cls = '') => {
    const on = sw.sort?.col === col;

// Command bar and details pane follow the selection without redrawing the list
function renderChrome() {
  const isList = sw.view === 'list';
  const key = isList ? sw.sel : sw.view;
  const s = key ? SOFTWARE[key] : null;
  const other = sw.layout === 'details' ? { id: 'icons', label: 'Large icons', icon: 'i-view-icons' } : { id: 'details', label: 'Details', icon: 'i-view-details' };
  $('#sw-cmd').innerHTML = isList
    ? `<button class="cmd" data-cmd="open" ${s ? '' : 'disabled'}>Open</button>
       ${s ? `<a class="cmd" href="${s.url}" target="_blank" rel="noopener">${s.actionShort}</a>` : `<button class="cmd" disabled>Download</button>`}
       <button class="cmd right" data-cmd="layout" data-layout="${other.id}" aria-label="Change view to ${other.label}">${ico(other.icon, 16)}${other.label}</button>`
    : `<button class="cmd" data-nav="list">All software</button>
       <a class="cmd" href="${s.url}" target="_blank" rel="noopener">${s.actionShort}</a>`;
  $('#sw-details').innerHTML = s
    ? `${ico(s.icon, 48)}
       <div class="dp-main"><div class="dp-name">${s.name}</div><div class="muted">${s.type}</div></div>
       <dl class="dp-props">${s.version ? `<dt>Version:</dt><dd>${s.version}</dd>` : ''}${s.size ? `<dt>Size:</dt><dd>${s.size}</dd>` : ''}<dt>Source:</dt><dd>GitHub</dd></dl>
       ${isList ? `<p class="dp-desc">${s.description}</p>` : ''}`
    : `${ico('i-folder', 48)}<div class="dp-main"><div class="dp-name">My Software</div><div class="muted">${visibleItems().length} items</div></div>`;
}

function selectItem(key, focus = false) {
  sw.sel = key;
  for (const r of $$('#sw-content [data-key]')) {
    const on = r.dataset.key === key;
    r.classList.toggle('sel', on);
    if (r.tagName === 'TR') r.setAttribute('aria-selected', on);
    if (on && focus) r.focus();
  }
  renderChrome();
}

function wireSoftware() {
  // Delegated on the document: the window is rebuilt every time it opens
  document.addEventListener('click', e => {
    if (!e.target.closest('#win-software')) return;
    const nav = e.target.closest('[data-nav]');
    if (nav) { navigate(nav.dataset.nav); return; }
    const sort = e.target.closest('[data-sort]');
    if (sort) {
      const col = sort.dataset.sort;
      sw.sort = sw.sort?.col === col ? { col, dir: -sw.sort.dir } : { col, dir: 1 };
      $('#sw-content').innerHTML = listHTML(); renderChrome();
      $(`#sw-content [data-sort="${col}"]`)?.focus();
      return;
    }
    const cmd = e.target.closest('[data-cmd]');
    if (cmd) {
      if (cmd.dataset.cmd === 'open' && sw.sel) navigate(sw.sel);
      if (cmd.dataset.cmd === 'layout') { sw.layout = cmd.dataset.layout; $('#sw-content').innerHTML = listHTML(); renderChrome(); $('[data-cmd="layout"]')?.focus(); }
      return;
    }
    const row = e.target.closest('#sw-content [data-key]');
    if (row) { if (opensOnSingle()) navigate(row.dataset.key); else selectItem(row.dataset.key); return; }
    if (sw.view === 'list' && e.target.closest('#sw-content') && sw.sel) selectItem(null);
  });
  document.addEventListener('dblclick', e => {
    const row = e.target.closest('#sw-content [data-key]');
    if (row) navigate(row.dataset.key);
  });
  document.addEventListener('keydown', e => {
    const row = e.target.closest?.('#sw-content [data-key]');
    if (!row) return;
    if (e.key === 'Enter') { e.preventDefault(); navigate(row.dataset.key); return; }
    const rows = $$('#sw-content [data-key]'), i = rows.indexOf(row);
    const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (step && rows[i + step]) { e.preventDefault(); selectItem(rows[i + step].dataset.key, true); }
  });
  document.addEventListener('focusin', e => {
    const row = e.target.closest?.('#sw-content tr[data-key]');
    if (row && sw.sel !== row.dataset.key && lastPointer === 'mouse') selectItem(row.dataset.key);
  });
  document.addEventListener('input', e => {
    if (e.target.id !== 'sw-search') return;
    sw.q = e.target.value;
    if (sw.sel && !visibleItems().includes(sw.sel)) sw.sel = null;
    $('#sw-content').innerHTML = listHTML(); renderChrome();
  });
}

// ============================================
// WAVEFORM SLIDER (before/after drag comparison)
// ============================================
function mountWaveform(root) {
  const stage = $('.wf-stage', root), cBefore = $('.wf-before', root), cAfter = $('.wf-after', root), line = $('.wf-line', root);
  const ac = new AbortController(), opt = { signal: ac.signal };
  let pos = 0.5, dragging = false;

  function draw() {
    const r = stage.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const [canvas, data, color] of [[cBefore, WAVEFORM_BEFORE, 'rgba(255, 138, 122, 0.85)'], [cAfter, WAVEFORM_AFTER, 'rgba(111, 211, 255, 0.85)']]) {
      canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = r.width, h = r.height, mid = h / 2, barW = w / data.length;
      ctx.fillStyle = color;
      for (let i = 0; i < data.length; i++) {
        const val = data[i] * mid * 0.9;
        ctx.fillRect(i * barW, mid - val, Math.max(barW - 0.5, 1), val * 2);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(0, mid - 0.5, w, 1);
    }
  }
  function apply() {
    const pct = pos * 100;
    cBefore.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    cAfter.style.clipPath = `inset(0 0 0 ${pct}%)`;
    line.style.left = pct + '%';
    stage.setAttribute('aria-valuenow', Math.round(pct));
    stage.setAttribute('aria-valuetext', `Showing ${Math.round(pct)}% before, ${100 - Math.round(pct)}% after`);
  }
  function setFrom(e) {
    const r = stage.getBoundingClientRect();
    pos = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    apply();
  }
  stage.addEventListener('pointerdown', e => { dragging = true; stage.setPointerCapture(e.pointerId); setFrom(e); }, opt);
  stage.addEventListener('pointermove', e => { if (dragging) setFrom(e); }, opt);
  stage.addEventListener('pointerup', () => { dragging = false; }, opt);
  stage.addEventListener('pointercancel', () => { dragging = false; }, opt);
  stage.addEventListener('keydown', e => {
    const d = { ArrowLeft: -0.02, ArrowDown: -0.02, ArrowRight: 0.02, ArrowUp: 0.02 }[e.key];
    if (d) pos = Math.max(0, Math.min(1, pos + d));
    else if (e.key === 'Home') pos = 0;
    else if (e.key === 'End') pos = 1;
    else return;
    e.preventDefault(); apply();
  }, opt);

  draw(); apply();
  return { redraw: draw, destroy() { ac.abort(); } };
}

// ============================================
// SR VISUAL AUTOMATER DEMO: SINGLE BOX MOVES
// One blue box. Cursor clicks cells, blue box relocates.
// Yellow = background, revealed after first shrink.
// Loops while the pointer is over it (or after a tap).
// ============================================
function mountGridDemo(root) {
  const container = $('.grid-demo', root), canvas = $('canvas', container);
  const ctx = canvas.getContext('2d');
  const ac = new AbortController(), opt = { signal: ac.signal };
  let w = 0, h = 0, L = null;
  let playing = false, reversing = false, reverseAlpha = 1, frame = -1, raf = 0;

  const cols = 4, rows = 4, gap = 8, cellPad = 2, pvBorder = 3;
  const gridSizes = ['2x2', '3x3', '4x4', '5x5'];
  const selectedGrid = 2;

  // Click sequence: [row, col]
  const CLICKS = [{ r: 0, c: 0 }, { r: 0, c: 3 }, { r: 3, c: 3 }, { r: 3, c: 0 }, { r: 1, c: 2 }, { r: 2, c: 1 }];

  // Per-action timing (frames at 60fps)
  const SETTLE = 2, PAUSE = 9, SNAP = 12, HOLD = 30, FIRST_MOVE = 60, MOVE = 40;
  const actions = [];
  let totalFrames = 0;
  CLICKS.forEach((click, i) => {
    const moveF = i === 0 ? FIRST_MOVE : MOVE, start = totalFrames;
    actions.push({ r: click.r, c: click.c, start, moveEnd: start + moveF, settleEnd: start + moveF + SETTLE, pauseEnd: start + moveF + SETTLE + PAUSE, snapEnd: start + moveF + SETTLE + PAUSE + SNAP });
    totalFrames = start + moveF + SETTLE + PAUSE + SNAP + HOLD;
  });
  totalFrames += 30; // extra pause before loop

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);

  function layout() {
    const r = container.getBoundingClientRect();
    if (!r.width) return false;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sidebarW = 70, gridAreaX = sidebarW + gap, contentW = w - sidebarW - gap * 3, gridW = contentW * 0.48;
    const previewX = gridAreaX + gridW + gap, previewW = w - previewX - gap, topY = gap, areaH = h - gap * 2;
    L = { sidebarW, gridAreaX, gridW, previewX, previewW, topY, areaH, cellW: gridW / cols, cellH: areaH / rows, pvCellW: previewW / cols, pvCellH: areaH / rows };
    return true;
  }

  const cellCenter = (r, c) => ({ x: L.gridAreaX + c * L.cellW + L.cellW * 0.35, y: L.topY + r * L.cellH + L.cellH * 0.45 });

  function drawCursor(x, y) {
    ctx.save();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + 22); ctx.lineTo(x + 5, y + 17); ctx.lineTo(x + 9, y + 24);
    ctx.lineTo(x + 12, y + 22.5); ctx.lineTo(x + 7.5, y + 15); ctx.lineTo(x + 14, y + 15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawBase(selectedCell) {
    ctx.fillStyle = '#1f1f1f'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 0, L.sidebarW, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, L.sidebarW, h);
    gridSizes.forEach((label, i) => {
      const y = 20 + i * 48;
      ctx.beginPath(); ctx.arc(16, y, 7, 0, Math.PI * 2);
      if (i === selectedGrid) {
        ctx.fillStyle = '#33CED6'; ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(16, y, 3, 0, Math.PI * 2); ctx.fill();
      } else { ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.fillStyle = i === selectedGrid ? '#fff' : '#999';
      ctx.font = '600 13px "Segoe UI", "Open Sans", sans-serif';
      ctx.fillText(label, 28, y + 5);
    });
    ctx.fillStyle = '#000'; ctx.fillRect(L.gridAreaX, L.topY, L.gridW, L.areaH);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      ctx.fillStyle = selectedCell && r === selectedCell.r && c === selectedCell.c ? 'rgba(120, 220, 255, 0.55)' : '#e8e8e8';
      ctx.fillRect(L.gridAreaX + c * L.cellW + cellPad, L.topY + r * L.cellH + cellPad, L.cellW - cellPad * 2, L.cellH - cellPad * 2);
    }
  }

  function drawBlue(x, y, bw, bh) {
    ctx.fillStyle = '#42b4f5'; ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = 'rgba(150, 210, 255, 0.8)'; ctx.lineWidth = pvBorder;
    ctx.strokeRect(x + pvBorder / 2, y + pvBorder / 2, bw - pvBorder, bh - pvBorder);
  }

  function drawHint() {
    ctx.font = '12px "Segoe UI", "Open Sans", sans-serif'; ctx.textAlign = 'center';
    const label = (canHover.matches ? 'Hover' : 'Tap') + ' to see it in action';
    const tw = ctx.measureText(label).width + 18;
    ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(w / 2 - tw / 2, h - 27, tw, 20);
    ctx.fillStyle = '#e6ebf2'; ctx.fillText(label, w / 2, h - 13);
    ctx.textAlign = 'left';
  }

  function drawStill() {
    drawBase(null);
    drawBlue(L.previewX, L.topY, L.previewW, L.areaH);
    drawHint();
  }

  function drawScene(gf) {
    let activeIdx = -1;
    for (let i = actions.length - 1; i >= 0; i--) if (gf >= actions[i].start) { activeIdx = i; break; }
    let selectedCell = null;
    for (let i = 0; i <= activeIdx; i++) if (gf >= actions[i].settleEnd) selectedCell = { r: actions[i].r, c: actions[i].c };
    drawBase(selectedCell);

    // Yellow background: revealed after first box shrinks
    const first = actions[0];
    let p = 0;
    if (gf > first.pauseEnd) p = easeOutQuart(Math.min(1, (gf - first.pauseEnd) / SNAP));
    if (p > 0) {
      ctx.fillStyle = `rgba(241, 196, 15, ${Math.min(1, p) * 0.9})`;
      ctx.fillRect(L.previewX, L.topY, L.previewW, L.areaH);
      ctx.strokeStyle = `rgba(220, 180, 20, ${Math.min(1, p) * 0.8})`; ctx.lineWidth = pvBorder;
      ctx.strokeRect(L.previewX + pvBorder / 2, L.topY + pvBorder / 2, L.previewW - pvBorder, L.areaH - pvBorder);
    }

    if (activeIdx <= 0) {
      const tx = L.previewX + first.c * L.pvCellW, ty = L.topY + first.r * L.pvCellH;
      drawBlue(L.previewX + (tx - L.previewX) * p, L.topY + (ty - L.topY) * p, L.previewW - (L.previewW - L.pvCellW) * p, L.areaH - (L.areaH - L.pvCellH) * p);
    } else {
      const a = actions[activeIdx], prev = actions[activeIdx - 1];
      const fx = L.previewX + prev.c * L.pvCellW, fy = L.topY + prev.r * L.pvCellH;
      const tx = L.previewX + a.c * L.pvCellW, ty = L.topY + a.r * L.pvCellH;
      let m = 0;
      if (gf > a.pauseEnd) m = easeOutQuart(Math.min(1, (gf - a.pauseEnd) / SNAP));
      drawBlue(fx + (tx - fx) * m, fy + (ty - fy) * m, L.pvCellW, L.pvCellH);
    }

    if (activeIdx >= 0) {
      const a = actions[activeIdx];
      if (gf <= a.snapEnd + 5) {
        const from = activeIdx === 0 ? { x: L.gridAreaX + L.gridW * 0.55, y: L.topY + L.areaH * 0.55 } : cellCenter(actions[activeIdx - 1].r, actions[activeIdx - 1].c);
        const to = cellCenter(a.r, a.c);
        const t = easeOutCubic(Math.min(1, (gf - a.start) / (a.moveEnd - a.start)));
        drawCursor(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t);
      }
    }
  }

  function tick() {
    raf = 0;
    if (!canvas.isConnected) return;
    if (playing) {
      reversing = false; reverseAlpha = 1;
      frame = frame < 0 ? 0 : frame + 1;
      if (frame >= totalFrames) frame = 0; // loop
    } else if (frame >= 0) {
      reversing = true; reverseAlpha -= 0.05;
      if (reverseAlpha <= 0) { frame = -1; reversing = false; reverseAlpha = 1; }
    }
    if (reversing) {
      ctx.globalAlpha = 1; drawStill();
      ctx.globalAlpha = Math.max(0, reverseAlpha); drawScene(frame);
      ctx.globalAlpha = 1;
    } else if (frame < 0) drawStill();
    else drawScene(frame);
    if (playing || frame >= 0) raf = requestAnimationFrame(tick);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
  const setPlaying = v => { playing = v; container.setAttribute('aria-pressed', v); kick(); };

  container.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') setPlaying(true); }, opt);
  container.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setPlaying(false); }, opt);
  container.addEventListener('click', e => { if (lastPointer !== 'mouse' || e.detail === 0) setPlaying(!playing); }, opt);
  container.addEventListener('blur', () => { if (lastPointer !== 'mouse') setPlaying(false); }, opt);

  if (layout()) drawStill();
  return {
    redraw() { if (layout()) { if (frame < 0) drawStill(); else drawScene(frame); } },
    destroy() { ac.abort(); cancelAnimationFrame(raf); }
  };
}

// ============================================
// WALLPAPER: the ChorusCrisp before/after waveforms, bent into two bands of light
// ============================================
function drawWallpaper() {
  const c = $('#wallpaper'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = Math.hypot(w, h);
  const g = x.createRadialGradient(w * 0.66, h * 0.36, 0, w * 0.66, h * 0.36, R * 0.8);
  g.addColorStop(0, '#3f9ef4'); g.addColorStop(0.24, '#1f74d6'); g.addColorStop(0.58, '#0d4aa2'); g.addColorStop(1, '#04235a');
  x.fillStyle = g; x.fillRect(0, 0, w, h);

  const bez = (p, t) => {
    const u = 1 - t;
    return {
      x: (u * u * u * p[0][0] + 3 * u * u * t * p[1][0] + 3 * u * t * t * p[2][0] + t * t * t * p[3][0]) * w,
      y: (u * u * u * p[0][1] + 3 * u * u * t * p[1][1] + 3 * u * t * t * p[2][1] + t * t * t * p[3][1]) * h
    };
  };
  function band(src, p, amp, rgb, strength) {
    // twice the bars of the source data, so they stay fine at any width
    const data = [];
    for (let i = 0; i < src.length - 1; i++) data.push(src[i], (src[i] + src[i + 1]) / 2);
    data.push(src[src.length - 1]);
    const n = data.length, pts = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), a = bez(p, t), b = bez(p, Math.min(1, t + 0.004)), a0 = bez(p, Math.max(0, t - 0.004));
      let nx = -(b.y - a0.y), ny = b.x - a0.x; const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      pts.push({ x: a.x, y: a.y, nx, ny, v: data[i] * amp * Math.pow(Math.sin(Math.PI * t), 0.7) });
    }
    const fade = x.createLinearGradient(0, 0, w, 0);
    fade.addColorStop(0, `rgba(${rgb},0)`); fade.addColorStop(0.22, `rgba(${rgb},1)`); fade.addColorStop(0.78, `rgba(${rgb},1)`); fade.addColorStop(1, `rgba(${rgb},0)`);
    // a soft glow under the band, from the smoothed envelope
    const soft = pts.map((q, i) => { let s = 0, k = 0; for (let j = Math.max(0, i - 14); j <= Math.min(n - 1, i + 14); j++) { s += pts[j].v; k++; } return s / k; });
    x.save();
    if ('filter' in x) x.filter = `blur(${Math.round(h * 0.022)}px)`;
    x.beginPath();
    pts.forEach((q, i) => { const X = q.x + q.nx * soft[i] * 1.5, Y = q.y + q.ny * soft[i] * 1.5; i ? x.lineTo(X, Y) : x.moveTo(X, Y); });
    for (let i = n - 1; i >= 0; i--) { const q = pts[i]; x.lineTo(q.x - q.nx * soft[i] * 1.5, q.y - q.ny * soft[i] * 1.5); }
    x.closePath(); x.globalAlpha = 0.13 * strength; x.fillStyle = fade; x.fill();
    x.restore();
    // the waveform itself, one bar per sample
    const step = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 4;
    x.beginPath();
    for (const q of pts) { x.moveTo(q.x + q.nx * q.v, q.y + q.ny * q.v); x.lineTo(q.x - q.nx * q.v, q.y - q.ny * q.v); }
    x.globalAlpha = 0.21 * strength; x.strokeStyle = fade; x.lineWidth = Math.max(1.2, Math.min(3, step * 0.45)); x.stroke();
    x.globalAlpha = 1;
  }
  x.globalCompositeOperation = 'lighter';
  band(WAVEFORM_BEFORE, [[-0.08, 0.78], [0.24, 1.04], [0.52, 0.14], [1.08, 0.34]], h * 0.13, '170,222,255', 1);
  band(WAVEFORM_AFTER, [[-0.08, 1.0], [0.34, 1.03], [0.6, 0.46], [1.08, 0.68]], h * 0.1, '205,240,255', 0.85);
  x.globalCompositeOperation = 'source-over';
}
drawWallpaper();

let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    drawWallpaper();
    const dw = desktop.clientWidth, dh = desktop.clientHeight;
    for (const w of Object.values(wins)) {
      const el = w.el;
      el.style.width = Math.min(el.offsetWidth, dw - 16) + 'px';
      el.style.height = Math.min(el.offsetHeight, dh - 12) + 'px';
      el.style.left = Math.max(90 - el.offsetWidth, Math.min(parseFloat(el.style.left), dw - 90)) + 'px';
      el.style.top = Math.max(0, Math.min(parseFloat(el.style.top), dh - 30)) + 'px';
    }
  }, 120);
});

// ============================================
// WELCOME
// ============================================
const welcome = $('#welcome');
let welcomeTimer = 0;
function startSession() {
  clearTimeout(welcomeTimer);
  welcome.classList.add('gone');
  if (!Object.keys(wins).length) {
    if (!compact.matches) openWindow('about');
    openWindow('software');
  }
}
function showWelcome(ms) {
  welcome.classList.remove('gone');
  welcomeTimer = setTimeout(startSession, ms);
}
welcome.addEventListener('pointerdown', startSession);
document.addEventListener('keydown', e => { if (!welcome.classList.contains('gone') && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) startSession(); });
$('#logoff').addEventListener('click', () => {
  closeStart();
  Object.keys(wins).forEach(closeWindow);
  showWelcome(1500);
});

renderTasks();
loadXlethRelease();
let seen = false;
try { seen = sessionStorage.getItem('krasenos-welcome') === '1'; sessionStorage.setItem('krasenos-welcome', '1'); } catch (err) { /* storage can be blocked; the welcome just plays again */ }
if (seen) startSession(); else welcomeTimer = setTimeout(startSession, 1700);

})();
</script>
